# prebuild docker image   https://hub.docker.com/r/barichello/godot-ci/
image: barichello/godot-ci:4.7.2

variables:
  EXPORT_NAME: club-tiger

stages:
  - export
  - deploy

windows:
  stage: export
  script:
    - mkdir -v -p build/windows
    - godot -v --export "Windows Desktop" ./build/windows/$EXPORT_NAME.exe
  artifacts:
    name: $EXPORT_NAME-$CI_JOB_NAME
    paths:
      - build/windows
